# Configuración de nginx para el Sistema de Turnos - Clínica
#
# nginx es el único punto de entrada (puerto 80):
#   - sirve los archivos del frontend (resultado de `ng build`)
#   - reenvía todo lo que empiece con /api/ al backend NestJS (puerto 3000, corriendo con PM2)
#
# Uso (en una terminal, parado en la carpeta clinica-turnos):
#   "C:\nginx-1.31.4\nginx.exe" -p nginx/ -c nginx.conf          iniciar
#   "C:\nginx-1.31.4\nginx.exe" -p nginx/ -c nginx.conf -t       verificar la configuración
#   "C:\nginx-1.31.4\nginx.exe" -p nginx/ -c nginx.conf -s reload    recargar tras cambiar este archivo
#   "C:\nginx-1.31.4\nginx.exe" -p nginx/ -c nginx.conf -s stop      detener
#
# Las rutas relativas (logs/, mime.types, ../frontend/...) se resuelven desde la carpeta nginx/ (-p).

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Registro de solicitudes (fecha, IP, endpoint, código de estado)
    access_log  logs/access.log;

    sendfile        on;
    keepalive_timeout  65;

    # No informar la versión de nginx en las respuestas
    server_tokens off;

    # Compresión de los archivos del frontend
    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Protección contra fuerza bruta en el login: máximo 30 pedidos por minuto por IP
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=30r/m;
    limit_req_status 429;

    # Backend NestJS (levantado con PM2). Se pueden agregar más servidores acá para balancear la carga.
    upstream backend_nest {
        server 127.0.0.1:3000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Datos del pedido original que se le informan al backend
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;

        # Login: mismo proxy pero con límite de intentos
        location = /api/v1/auth {
            limit_req   zone=login  burst=10  nodelay;
            proxy_pass  http://backend_nest;
        }

        # API REST (y Swagger en /api/): se reenvía al backend tal cual
        location /api/ {
            proxy_pass  http://backend_nest;
        }

        location = /api {
            return 301 /api/;
        }

        # Frontend Angular: archivos estáticos generados por `ng build`
        location / {
            root   ../frontend/dist/frontend/browser;
            index  index.html;

            # Las rutas de Angular (/reservas, /agenda, ...) no son archivos: se devuelve index.html
            try_files  $uri  $uri/  /index.html;

            add_header  X-Content-Type-Options  "nosniff"      always;
            add_header  X-Frame-Options         "SAMEORIGIN"   always;
            add_header  Referrer-Policy         "same-origin"  always;
        }
    }
}
