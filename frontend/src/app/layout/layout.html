<header id="barra">
    <a id="marca" [routerLink]="rutaInicio">
        <span id="logo"><i class="pi pi-heart"></i></span>
        <span id="titulo">Sistema de Turnos</span>
    </a>

    <div id="usuario">
        @if (esAdministrador) {
            <div class="persona">
                <i class="pi pi-shield"></i>
                <span class="nombre">Administrador</span>
            </div>
        } @else {
            <div class="persona">
                <i class="pi pi-user"></i>
                <div>
                    <div class="nombre">{{ prefijoRol }} {{ nombreCompleto }}</div>
                    <div class="documento">DNI {{ usuario?.documento }}</div>
                </div>
            </div>
        }
        <p-button label="Cerrar sesión" icon="pi pi-sign-out" styleClass="boton-salir" (onClick)="cerrarSesion()" />
    </div>
</header>

<main id="contenido">
    <router-outlet />
</main>
