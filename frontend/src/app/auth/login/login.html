<div id="pantalla">

    <section id="panel-info">
        <div id="marca">
            <span id="logo"><i class="pi pi-heart"></i></span>
            <div>
                <p id="marca-nombre">Clínica Médica</p>
                <p id="marca-sub">Sistema de turnos</p>
            </div>
        </div>

        <ul id="datos">
            <li><i class="pi pi-calendar-plus"></i>Reservas con hasta 30 días de anticipación</li>
            <li><i class="pi pi-clock"></i>Atención de 8 a 16 hs</li>
            <li><i class="pi pi-calendar-times"></i>Cancelación hasta el día anterior a la consulta</li>
        </ul>
    </section>

    <section id="panel-form">
        <form id="tarjeta" [formGroup]="form" (ngSubmit)="iniciarSesion()">
            <h2 id="header">Iniciar sesión</h2>

            <div class="campo">
                <label for="documento">Documento</label>
                <p-iconfield>
                    <p-inputicon class="pi pi-id-card" />
                    <input pInputText id="documento" type="text" placeholder="Ej: 30222333" formControlName="documento"
                        fluid />
                </p-iconfield>
            </div>

            <div class="campo">
                <label for="clave">Clave de acceso</label>
                <p-password inputId="clave" formControlName="clave" [feedback]="false" [toggleMask]="true"
                    autocomplete="off" placeholder="Clave de acceso" fluid />
            </div>

            <p-button type="submit" label="Iniciar sesión" icon="pi pi-sign-in" fluid />
        </form>
    </section>

</div>
